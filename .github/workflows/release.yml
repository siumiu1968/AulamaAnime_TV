name: Aulama Anime TV Build and Release

on:
  push:
    branches:
      - 'codex/**'
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore upgrade-compatible signing key
        env:
          TV_SIGNING_KEY_BASE64: ${{ secrets.TV_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$TV_SIGNING_KEY_BASE64"
          printf '%s' "$TV_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/aulama-tv-release.jks"
      - name: Test and build
        env:
          TV_KEYSTORE_PATH: ${{ runner.temp }}/aulama-tv-release.jks
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: |
          chmod a+x ./gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Verify and rename APK
        id: apk
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -qi 'f75ce15910009cf9735dfb2d32fbc586c01f52d0cacb73d51f1e2801a33b6dce' /tmp/apk-signature.txt
          if [[ "$REF_TYPE" == "tag" ]]; then
            APK_NAME="aulama-anime-tv-${REF_NAME}.apk"
          else
            APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
            test -n "$APP_VERSION"
            APK_NAME="aulama-anime-tv-v${APP_VERSION}.apk"
          fi
          mv "$APK" "$APK_NAME"
          printf 'apk_name=%s\n' "$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Smoke-test signed release APK on Android TV
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          SMOKE_APK: ${{ steps.apk.outputs.apk_name }}
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_720p
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          disable-animations: true
          script: |
            mkdir -p app/build/release-startup-smoke
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.jing.sakura.compose.screen.RegionBlockedFocusTest,com.jing.sakura.player.PlayerProgressAlignmentTest,com.jing.sakura.player.SegmentEditorDialogTest,com.jing.sakura.compose.screen.ArtworkLoadingTipsTest,com.jing.sakura.compose.screen.HomeStartupScreenTest,com.jing.sakura.compose.common.HeroPreviewPreparationTest,com.jing.sakura.compose.screen.CrossDeviceCampaignDialogTest com.codex.ciyuanbox.tv.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/release-startup-smoke/focus-tests.log
            adb pull /sdcard/Android/data/com.codex.ciyuanbox.tv/files/region-admin-actions.png app/build/release-startup-smoke/region-admin-actions.png || true
            adb pull /sdcard/Android/data/com.codex.ciyuanbox.tv/files/segment-editor.png app/build/release-startup-smoke/segment-editor.png || true
            adb pull /sdcard/Android/data/com.codex.ciyuanbox.tv/files/loading-tips.png app/build/release-startup-smoke/loading-tips.png || true
            adb pull /sdcard/Android/data/com.codex.ciyuanbox.tv/files/home-startup-retry.png app/build/release-startup-smoke/home-startup-retry.png || true
            adb pull /sdcard/Android/data/com.codex.ciyuanbox.tv/files/cross-device-campaign.png app/build/release-startup-smoke/cross-device-campaign.png || true
            grep -q 'OK (17 tests)' app/build/release-startup-smoke/focus-tests.log
            adb uninstall com.codex.ciyuanbox.tv
            python3 scripts/smoke_release_apk.py "$SMOKE_APK"
      - name: Upload Android TV startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-release-startup-${{ github.run_id }}
          path: |
            app/build/release-startup-smoke/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: aulama-anime-tv-${{ github.run_id }}
          path: ${{ steps.apk.outputs.apk_name }}
          retention-days: 14
      - name: Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          APK_NAME: ${{ steps.apk.outputs.apk_name }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$REF_NAME" =~ -(alpha|beta|rc)(\.|-|$) ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          NOTES_FILE="docs/RELEASE-${REF_NAME#v}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            RELEASE_FLAGS+=(--notes-file "$NOTES_FILE")
          else
            RELEASE_FLAGS+=(--generate-notes)
          fi
          gh release create "$REF_NAME" \
            "$APK_NAME" \
            --title "Aulama Anime TV ${REF_NAME}" \
            "${RELEASE_FLAGS[@]}"
